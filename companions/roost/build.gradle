plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
repositories { maven { url = 'https://maven.blamejared.com/' } }
version = project.mod_version
group = 'com.timwoodcreates.roost'
base { archivesName = 'roost-fabric-26.3' }
loom {
 splitEnvironmentSourceSets()
 mods { roost { sourceSet sourceSets.main; sourceSet sourceSets.client } }
}
dependencies {
 compileOnly "mezz.jei:jei-26.3-common-api:31.17.0.103"
 compileOnly "mezz.jei:jei-26.3-fabric-api:31.17.0.103"
 implementation files("../../build/libs/chickens-fabric-26.3-0.1.4.jar")
 minecraft "com.mojang:minecraft:${minecraft_version}"
 implementation "net.fabricmc:fabric-loader:${loader_version}"
 implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}
java { withSourcesJar(); sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25 }
tasks.withType(JavaCompile).configureEach { options.release = 25; options.encoding = 'UTF-8' }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand 'version': project.version } }
jar { from('LICENSE.txt') }

// The regression harness is an isolated development mod, never a release dependency.
if (providers.gradleProperty('regressionTests').getOrElse('false') == 'true') {
    sourceSets {
        regression {
            java.srcDir 'src/testmod/java'
            resources.srcDir 'src/testmod/resources'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
        }
    }
    configurations {
        regressionImplementation.extendsFrom implementation
        regressionRuntimeOnly.extendsFrom runtimeOnly
    }
    loom {
        mods {
            'roost-regression' { sourceSet sourceSets.regression }
        }
        runs {
            regressionServer {
                server()
                name = 'Roost regression server'
                source sourceSets.regression
                runDir 'run-regression'
                programArg '--nogui'
            }
        }
    }
    tasks.register('prepareRegressionServer') {
        doLast {
            def dir = file('run-regression')
            dir.mkdirs()
            new File(dir, 'eula.txt').text = 'eula=true\n'
            new File(dir, 'server.properties').text = 'online-mode=false\nserver-ip=127.0.0.1\nserver-port=0\nlevel-type=minecraft:flat\ngenerate-structures=false\nview-distance=2\nsimulation-distance=2\n'
        }
    }
    tasks.named('runRegressionServer') { dependsOn 'prepareRegressionServer' }
}
