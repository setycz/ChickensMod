name: Fabric 26.3 build
on:
  push:
    branches: [fabric-26.3]
  pull_request:
    branches: [fabric-26.3]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: python3 scripts/check_assets.py
      - run: ./gradlew build --no-daemon
      - name: Dedicated server regression
        run: |
          set -o pipefail
          ./gradlew -PregressionTests=true runRegressionServer --no-daemon | tee regression.log
          grep -q 'CHICKENS REGRESSION OK' regression.log
          ! grep -q 'CHICKENS REGRESSION FAILED' regression.log
      - name: Roost assets and build
        run: |
          python3 companions/roost/scripts/check_assets.py
          ./gradlew -p companions/roost build --no-daemon
      - name: Roost dedicated server regression
        run: |
          set -o pipefail
          ./gradlew -p companions/roost -PregressionTests=true runRegressionServer --no-daemon | tee roost-regression.log
          grep -q 'ROOST REGRESSION OK' roost-regression.log
          ! grep -q 'ROOST REGRESSION FAILED' roost-regression.log
      - uses: actions/upload-artifact@v4
        with:
          name: chickens-fabric-26.3
          path: |
            build/libs/*.jar
            companions/roost/build/libs/*.jar
